name: limpar previas
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apagar pastas com mais de 24h
        run: |
          mkdir -p p
          for d in p/*/; do
            [ -d "$d" ] || continue
            t=$(git log -1 --format=%ct -- "$d" 2>/dev/null)
            [ -z "$t" ] && continue
            if [ $(( $(date +%s) - t )) -gt 86400 ]; then git rm -rq "$d"; fi
          done
          git config user.name "limpeza"
          git config user.email "limpeza@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "limpeza: prévias com mais de 24h" && git push)
