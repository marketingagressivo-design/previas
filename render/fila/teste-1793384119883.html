<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1280" height="720"></canvas><script>const c=document.getElementById("c"),x=c.getContext("2d");window.renderAt=t=>{x.fillStyle="#102";x.fillRect(0,0,1280,720);for(let i=0;i<60;i++){x.fillStyle="hsl("+((i*6+t*90)%360)+",80%,55%)";x.fillRect((i*21+t*200)%1280,(i*37)%720,80,80);}x.fillStyle="#fff";x.font="64px sans-serif";x.fillText("TESTE "+t.toFixed(2),80,360);};window.renderAt(0);</script>
